modules:
  bitbucket:mergeCheck:
    - key: proof-of-done-merge-check
      name: Proof of Done
      description: Flags pull requests that make checks pass by weakening, skipping or
        deleting tests, or by hiding errors.
      function: check
      triggers:
        - on-code-pushed
        - on-reviewer-status-changed
  function:
    - key: check
      handler: index.check
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/830dc76c-c046-40a9-9f99-f5edfd5b76b1
permissions:
  scopes:
    - read:pullrequest:bitbucket
    - read:repository:bitbucket
