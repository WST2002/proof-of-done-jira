modules:
  jira:workflowCondition:
    - key: proof-of-done-condition
      name: Proof of Done (hide Done while the last check failed)
      description: Hides the transition while the work item's last Proof of Done check failed. Re-check from the Proof of Done panel to bring it back.
      expression: "issue.properties['proof-of-done'] == null || issue.properties['proof-of-done'].passed == true"
  jira:issuePanel:
    - key: proof-of-done-panel
      resource: panel
      resolver:
        function: resolver
      render: native
      title: Proof of Done
      icon: https://raw.githubusercontent.com/WST2002/proof-of-done-jira/main/icon.svg
  jira:issueContext:
    - key: proof-of-done-context
      resource: panel
      resolver:
        function: resolver
      render: native
      title: Proof of Done
      label: Proof of Done
      icon: https://raw.githubusercontent.com/WST2002/proof-of-done-jira/main/icon.svg
  jira:adminPage:
    - key: proof-of-done-admin
      resource: admin
      resolver:
        function: resolver
      render: native
      title: Proof of Done
  jira:workflowValidator:
    - key: proof-of-done-validator
      name: Proof of Done
      description: Allows the transition only when the work item's pull requests are
        merged, their checks really ran and passed, and their tests were not
        weakened.
      function: validate
  rovo:agent:
    - key: proof-of-done-agent
      name: Proof of Done
      description: Tells you whether a work item is really done, and what is missing if not.
      prompt: |
        You check whether a Jira work item is really done.
        When asked about a work item, call the check-done action with its key.
        Report the result plainly: if it is not done, list each problem and what to fix.
        Never say a work item is done unless the action says so.
      conversationStarters:
        - Is this work item really done?
        - What is blocking this from Done?
      actions:
        - check-done
  action:
    - key: check-done
      name: Check if a work item is really done
      function: checkDone
      actionVerb: GET
      description: |
        Checks the GitHub pull requests that mention a Jira work item key: merged, checks passed, tests changed and not weakened.
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: true
          description: The Jira work item key, for example SHOP-12.
  function:
    - key: validate
      handler: index.validate
    - key: checkDone
      handler: index.checkDone
    - key: resolver
      handler: index.handler
resources:
  - key: panel
    path: src/frontend/panel.jsx
  - key: admin
    path: src/frontend/admin.jsx
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/487a9b05-d2bc-4e8f-98ce-2c533e95676f
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
  external:
    fetch:
      backend:
        - address: api.github.com
        - address: api.bitbucket.org
